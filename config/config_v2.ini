[BallModel]
; Sumatra BallParameters.java (moduli-geometry):26。sim の geometry は球のモデルを送らないので Sumatra はこの値で予測する
AccSlideMmS2=-3000
; Sumatra BallParameters.java (moduli-geometry):33
AccRollMmS2=-260
; Sumatra BallParameters.java (moduli-geometry):40
KSwitch=0.64
; RAVEN app/config/system_model_real.yaml の ball_model.direct_kick (実機 3 番 0929、板に当たって蹴られなかった 5 本の中央値)。Sumatra は 0.55 と予測する (Sumatra BallParameters.java (moduli-geometry):59)
DirectKickNormalRestitution=0.47
; 同じ所。測っていない (RAVEN の既定)。Sumatra は 0.35 と予測する (Sumatra BallParameters.java (moduli-geometry):52)
DirectKickTangentRetention=1

