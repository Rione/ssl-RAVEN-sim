[Network]
blueTeamControlPort=10301
commandListenPort=20694
visionMulticastAddress=224.5.23.2
visionMulticastPort=10694
; 黄は RAVEN が mocSim (commandListenPort) で動かす。Sumatra は青で動いても黄に速度 0 を送ってくるので、
; 誰も RAVEN の黄を上書きしないよう、Sumatra の黄の指令はどこにも受けない口に向けて捨てる
yellowTeamControlPort=10399

[Physics]
AccBrakeAbsoluteMax=5000
AccBrakeAngularMax=100
AccSpeedupAbsoluteMax=5000
AccSpeedupAngularMax=100
BallRestitution=0.8
CCD=true
DesiredFps=60
Gravity=9.8
VelAbsoluteMax=5000
VelAngularMax=20
; maxAbsoluteStraightVelocity 7.5 m/s (Sumatra config/botParamsDatabase.json:118)
MaxLinearKickSpeed=7.5
; maxAbsoluteChipVelocity 5.5 m/s、3 次元の速さ (Sumatra config/botParamsDatabase.json:117)
MaxChipKickSpeed=5.5
; Sumatra は指令した初速で球が出る前提
KickerFriction=1
; Sumatra の sim の機体はいつも満充電 (SumatraSimBot.java:95 withKickerLevel(1.0))
KickerRechargeSec=0
; Sumatra のパスは受ける側で最大 3.2 m/s (PassFactory.java:24)。実機も 3 m/s 程度は捕れる見立てなので余裕を持たせる
DribblerCatchMaxSpeedMmS=4000

[Robot]
blueRobotCount=11
yellowRobotCount=11

[RobotModel]
; 全番号・両チーム共通。Sumatra (TIGERs) が sim の機体に前提にしている値
Enabled=true
; Sumatra は指令どおりに動く台で計画する (Sumatra config/botParamsDatabase.json:98-120 に遅れ・ゲインの項が無い)
TauVxSec=0
TauVySec=0
TauOmegaSec=0
DeadTimeSec=0
GainVx=1
GainVy=1
GainVyFromUx=0
GainVxFromUy=0
GainOmega=1
; accMaxFast 3.5 m/s^2 (Sumatra config/botParamsDatabase.json:108)。ふだんの accMax 3.0 は AI が自分で抑える
TractionAccelXMmS2=3500
TractionAccelYMmS2=3500
; brkMax 6.0 m/s^2 (Sumatra config/botParamsDatabase.json:102)
TractionDecelXMmS2=6000
TractionDecelYMmS2=6000
; 予算なし。Sumatra の movementLimits は並進と回転を別々に縛るだけ
WheelRimSpeedBudgetMmS=0
; velMaxW 20 rad/s (Sumatra config/botParamsDatabase.json:104)
MaxAngularVelRadS=20
; accMaxW 50 rad/s^2 (Sumatra config/botParamsDatabase.json:105)
MaxAngularAccelRadS2=50
; velMaxFast 4.0 m/s (Sumatra config/botParamsDatabase.json:107)。ふだんの velMax 3.0 は AI が自分で抑える
MaxLinearVelMmS=4000
